<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exemple de site partenaire — Connexion avec Claurc</title>
<style>
  body{ font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0e0f16; color:#eceef3;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
  h1{ font-size:22px; }
  #user-info{ font-size:15px; color:#9a9db2; }
</style>
</head>
<body>
  <h1>Exemple Boutique — se connecter avec Claurc</h1>
  <div id="claurc-login-btn-container"></div>
  <div id="user-info">Vérification…</div>

  <!-- Remplace AUTH_ORIGIN par l'URL réelle où tourne le serveur Claurc -->
  <script>const AUTH_ORIGIN = "http://localhost:4000";</script>
  <script src="http://localhost:4000/claurc-auth.js"></script>
  <script>
    Claurc.init({
      clientId: "exemple-boutique.com",
      authOrigin: AUTH_ORIGIN,
      onSuccess: (user) => {
        document.getElementById("user-info").textContent =
          `Connecté en tant que ${user.firstName} ${user.lastName} (@${user.username})`;
        document.getElementById("claurc-login-btn-container").innerHTML = "";
      },
      onError: (err) => console.warn(err.message),
    });

    // Reste connecté d'une visite à l'autre : revérifie la session existante en silence
    Claurc.restoreSession().then((user) => {
      if (!user) {
        document.getElementById("user-info").textContent = "Non connecté.";
        Claurc.renderButton("#claurc-login-btn-container");
      }
    });
  </script>
</body>
</html>
