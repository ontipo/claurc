name: Start Node Server
on: [push]

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your preferred Node version

      - name: Install and Run
        run: |
          cd server
          npm install
          node server.js
